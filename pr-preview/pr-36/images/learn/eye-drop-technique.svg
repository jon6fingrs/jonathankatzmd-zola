<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 560" width="760" height="560" role="img" aria-label="How to put in an eye drop: two steps"><title>How to put in an eye drop: two steps</title><defs><marker id="ah" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2a6ebb"/></marker><marker id="ahg" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#16a34a"/></marker><pattern id="tm" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="6" height="6" fill="#fde68a"/><line x1="0" y1="0" x2="0" y2="6" stroke="#b45309" stroke-width="2"/></pattern><pattern id="cloud" width="14" height="14" patternUnits="userSpaceOnUse"><rect width="14" height="14" fill="#d1d5db"/><circle cx="4" cy="4" r="2.2" fill="#9ca3af"/><circle cx="11" cy="10" r="1.6" fill="#9ca3af"/></pattern></defs><rect width="760" height="560" fill="#ffffff"/><rect x="166" y="110" width="68" height="92" rx="12" fill="#e0f2fe" stroke="#0369a1" stroke-width="3"/><rect x="176" y="196" width="48" height="16" fill="#0f9b8e"/><path d="M182,212 L218,212 L205,242 L195,242 Z" fill="#0f9b8e"/><path d="M200,260 C210,274 210,286 200,288 C190,286 190,274 200,260 Z" fill="#2a6ebb"/><path d="M70,380 Q200,285 330,380 Q200,500 70,380 Z" fill="#ffffff" stroke="#1f2937" stroke-width="3"/><path d="M88,394 Q200,492 312,394 Q200,450 88,394 Z" fill="#f9a8b4"/><circle cx="200" cy="362" r="42" fill="#5b8bb5" stroke="#2c4f6e" stroke-width="2"/><circle cx="200" cy="362" r="17" fill="#111827"/><circle cx="210" cy="352" r="6" fill="#ffffff"/><path d="M70,380 Q200,285 330,380" fill="none" stroke="#1f2937" stroke-width="5"/><g transform="rotate(0 200 452)"><rect x="178" y="452" width="44" height="120" rx="22" fill="#f1c7a8" stroke="#b07d5b" stroke-width="2"/><path d="M186,468 Q200,458 214,468" fill="none" stroke="#b07d5b" stroke-width="2"/></g><text x="30" y="40" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="30" font-weight="700" fill="#2a6ebb" text-anchor="start">1</text><text x="60" y="40" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="20" font-weight="600" fill="#1f2937" text-anchor="start">Look up and pull the</text><text x="60" y="64" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="20" font-weight="400" fill="#1f2937" text-anchor="start">lower lid down. Put one</text><text x="60" y="88" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="20" font-weight="400" fill="#1f2937" text-anchor="start">drop into the pocket.</text><path d="M440,370 Q570,310 700,370 Q570,410 440,370 Z" fill="#fde7d9" stroke="#1f2937" stroke-width="3"/><path d="M445,374 Q570,416 695,374" fill="none" stroke="#1f2937" stroke-width="4"/><line x1="474" y1="386" x2="466" y2="404" stroke="#1f2937" stroke-width="2.5"/><line x1="498" y1="388" x2="492" y2="406" stroke="#1f2937" stroke-width="2.5"/><line x1="522" y1="390" x2="518" y2="408" stroke="#1f2937" stroke-width="2.5"/><line x1="546" y1="392" x2="544" y2="410" stroke="#1f2937" stroke-width="2.5"/><line x1="570" y1="394" x2="570" y2="412" stroke="#1f2937" stroke-width="2.5"/><line x1="594" y1="392" x2="596" y2="410" stroke="#1f2937" stroke-width="2.5"/><line x1="618" y1="390" x2="622" y2="408" stroke="#1f2937" stroke-width="2.5"/><line x1="642" y1="388" x2="648" y2="406" stroke="#1f2937" stroke-width="2.5"/><line x1="666" y1="386" x2="674" y2="404" stroke="#1f2937" stroke-width="2.5"/><g transform="rotate(-35 428 378)"><rect x="406" y="378" width="44" height="120" rx="22" fill="#f1c7a8" stroke="#b07d5b" stroke-width="2"/><path d="M414,394 Q428,384 442,394" fill="none" stroke="#b07d5b" stroke-width="2"/></g><circle cx="440" cy="370" r="30" fill="none" stroke="#2a6ebb" stroke-width="3" stroke-dasharray="6 5"/><text x="410" y="40" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="30" font-weight="700" fill="#2a6ebb" text-anchor="start">2</text><text x="440" y="40" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="20" font-weight="600" fill="#1f2937" text-anchor="start">Close the eye gently and</text><text x="440" y="64" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="20" font-weight="400" fill="#1f2937" text-anchor="start">press the inner corner</text><text x="440" y="88" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="20" font-weight="400" fill="#1f2937" text-anchor="start">for 1 to 2 minutes.</text><text x="408" y="296" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="18" font-weight="400" fill="#5b6573" text-anchor="start">Inner corner, beside the nose</text><line x1="440" y1="304" x2="440" y2="338" stroke="#5b6573" stroke-width="1.5"/><circle cx="440" cy="338" r="3.5" fill="#5b6573"/><line x1="390" y1="20" x2="390" y2="540" stroke="#e5e7eb" stroke-width="2"/></svg>