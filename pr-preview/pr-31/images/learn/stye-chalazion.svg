<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 410" width="800" height="410" role="img" aria-label="A stye is a red, tender bump at the lash line; a chalazion is a firm lump in the lid from a blocked oil gland"><title>A stye is a red, tender bump at the lash line; a chalazion is a firm lump in the lid from a blocked oil gland</title><defs><marker id="ah" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2a6ebb"/></marker><marker id="ahg" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#16a34a"/></marker><pattern id="tm" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="6" height="6" fill="#fde68a"/><line x1="0" y1="0" x2="0" y2="6" stroke="#b45309" stroke-width="2"/></pattern><pattern id="cloud" width="14" height="14" patternUnits="userSpaceOnUse"><rect width="14" height="14" fill="#d1d5db"/><circle cx="4" cy="4" r="2.2" fill="#9ca3af"/><circle cx="11" cy="10" r="1.6" fill="#9ca3af"/></pattern></defs><rect width="800" height="410" fill="#ffffff"/><path d="M10,256 Q200,0 390,256 Q200,72 10,256 Z" fill="#f1c7a8" stroke="#b07d5b" stroke-width="2"/><clipPath id="fe200"><path d="M50,250 Q200,82.80000000000001 350,250 Q200,402.0 50,250 Z"/></clipPath><path d="M50,250 Q200,82.80000000000001 350,250 Q200,402.0 50,250 Z" fill="#ffffff" stroke="#1f2937" stroke-width="3"/><g clip-path="url(#fe200)"><circle cx="200" cy="250" r="54" fill="#5b8bb5" stroke="#2c4f6e" stroke-width="2"/><circle cx="200" cy="250" r="22" fill="#111827"/><circle cx="214" cy="234" r="7" fill="#ffffff"/></g><path d="M50,250 Q200,82.80000000000001 350,250" fill="none" stroke="#1f2937" stroke-width="5"/><path d="M410,256 Q600,0 790,256 Q600,72 410,256 Z" fill="#f1c7a8" stroke="#b07d5b" stroke-width="2"/><clipPath id="fe600"><path d="M450,250 Q600,82.80000000000001 750,250 Q600,402.0 450,250 Z"/></clipPath><path d="M450,250 Q600,82.80000000000001 750,250 Q600,402.0 450,250 Z" fill="#ffffff" stroke="#1f2937" stroke-width="3"/><g clip-path="url(#fe600)"><circle cx="600" cy="250" r="54" fill="#5b8bb5" stroke="#2c4f6e" stroke-width="2"/><circle cx="600" cy="250" r="22" fill="#111827"/><circle cx="614" cy="234" r="7" fill="#ffffff"/></g><path d="M450,250 Q600,82.80000000000001 750,250" fill="none" stroke="#1f2937" stroke-width="5"/><circle cx="150" cy="178" r="15" fill="#ef4444" stroke="#991b1b" stroke-width="2"/><circle cx="150" cy="178" r="5" fill="#fef3c7"/><ellipse cx="640" cy="140" rx="30" ry="22" fill="#eab08c" stroke="#b07d5b" stroke-width="2.5"/><path d="M620,132 Q640,118 660,132" fill="none" stroke="#fff" stroke-width="3" opacity="0.6" stroke-linecap="round"/><text x="200" y="34" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="24" font-weight="700" fill="#1f2937" text-anchor="middle">Stye</text><text x="600" y="34" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="24" font-weight="700" fill="#1f2937" text-anchor="middle">Chalazion</text><text x="20" y="96" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="19" font-weight="600" fill="#b91c1c" text-anchor="start">Red, tender bump</text><text x="20" y="120" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="19" font-weight="400" fill="#1f2937" text-anchor="start">at the lash line</text><line x1="96" y1="128" x2="140" y2="168" stroke="#5b6573" stroke-width="1.5"/><circle cx="140" cy="168" r="3.5" fill="#5b6573"/><text x="420" y="96" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="19" font-weight="600" fill="#1f2937" text-anchor="start">Firm, usually painless</text><text x="420" y="120" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="19" font-weight="400" fill="#1f2937" text-anchor="start">lump in the lid</text><line x1="560" y1="116" x2="618" y2="134" stroke="#5b6573" stroke-width="1.5"/><circle cx="618" cy="134" r="3.5" fill="#5b6573"/><text x="200" y="372" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="18" font-weight="400" fill="#5b6573" text-anchor="middle">An infected lash follicle or gland;</text><text x="200" y="394" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="18" font-weight="400" fill="#5b6573" text-anchor="middle">comes up over a day or two</text><text x="600" y="372" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="18" font-weight="400" fill="#5b6573" text-anchor="middle">A blocked oil gland;</text><text x="600" y="394" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="18" font-weight="400" fill="#5b6573" text-anchor="middle">can last for weeks</text><line x1="400" y1="10" x2="400" y2="400" stroke="#e5e7eb" stroke-width="2"/></svg>