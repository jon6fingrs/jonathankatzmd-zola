# Builds the site and runs the dosing-rule tests on every push and pull
# request. A push to master that passes is then deployed to Cloudflare Pages
# (the deploy job); a red check never deploys. See SETUP.md, "Cloudflare".
name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  build:
    name: Build site and run tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Zola (same version as docker-compose.yml)
        run: |
          curl -sSL -o zola.tar.gz https://github.com/getzola/zola/releases/download/v0.23.3/zola-v0.23.3-x86_64-unknown-linux-gnu.tar.gz
          tar xzf zola.tar.gz zola
          sudo mv zola /usr/local/bin/zola
          zola --version

      # SITE_BASE_URL (repository variable) overrides config.toml's base_url.
      # Set it to "/" while the site is only on *.pages.dev, so links stay on
      # that copy; delete it at cutover.
      - name: Build
        env:
          SITE_BASE_URL: ${{ vars.SITE_BASE_URL }}
        run: zola build ${SITE_BASE_URL:+--base-url "$SITE_BASE_URL"}

      - name: Check internal links
        run: zola check --skip-external-links

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Dosing-rule tests
        run: node --test 'tests/**/*.test.js'

      - name: Drug data is valid JSON with the expected keys
        run: |
          node -e '
            const d = require("./static/data/eye-drops.json");
            const keys = ["generic","brand","color","use","dosage","notes","photos"];
            const fs = require("fs");
            let bad = 0;
            for (const e of d) {
              for (const k of keys) if (!(k in e)) { console.error("missing", k, "in", e.generic); bad++; }
              for (const p of e.photos) if (!fs.existsSync("static/images/drops/" + p)) { console.error("missing photo", p, "for", e.generic); bad++; }
            }
            console.log(d.length, "drugs checked");
            process.exit(bad ? 1 : 0);
          '

      - name: Upload built site
        uses: actions/upload-artifact@v4
        with:
          name: public
          path: public/
          retention-days: 7

  deploy:
    name: Deploy to Cloudflare Pages
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    concurrency:
      group: cloudflare-production
      cancel-in-progress: false
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Check Cloudflare is set up
        id: gate
        run: |
          if [ -n "$CLOUDFLARE_API_TOKEN" ] && [ -n "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "Cloudflare secrets not set; skipping deploy (see SETUP.md)." | tee -a "$GITHUB_STEP_SUMMARY"
          fi

      # Needed for functions/ and wrangler.toml; the site itself is the
      # exact build the tests ran against.
      - uses: actions/checkout@v4
        if: steps.gate.outputs.ready == 'true'

      - uses: actions/download-artifact@v4
        if: steps.gate.outputs.ready == 'true'
        with:
          name: public
          path: public

      - uses: actions/setup-node@v4
        if: steps.gate.outputs.ready == 'true'
        with:
          node-version: 22

      # Creates the Pages project on the first run; a no-op after that.
      - name: Create Pages project if missing
        if: steps.gate.outputs.ready == 'true'
        run: npx --yes wrangler@4.156.0 pages project create jonathankatzmd --production-branch master || true

      - name: Deploy
        if: steps.gate.outputs.ready == 'true'
        run: npx --yes wrangler@4.156.0 pages deploy --branch master --commit-hash "$GITHUB_SHA"
