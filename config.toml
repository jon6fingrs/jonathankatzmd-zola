base_url = "https://jonathankatzmd.com"
title = "Jonathan Katz, MD"
description = "Jonathan Katz, MD — Ophthalmologist and Glaucoma Specialist, Katzen Eye Group, Baltimore, Maryland"
default_language = "en"
# No theme: all templates live in templates/ and all styling in static/css/custom.css.

compile_sass = true
minify_html = true
generate_feeds = false
build_search_index = false

[extra]
logo = "images/logo.png"
footer_logo = "images/logo.png"
display_cta = false
# Staging subdomain: keep it out of search results so it can't compete with
# jonathankatzmd.com for the practice's own name. Set to false at cutover.
noindex = false
copyright = "Jonathan Katz, MD"
tagline_1 = "Ophthalmologist"
tagline_2 = "Glaucoma Specialist"
hero_image = "images/team/jonathan-katz-cutout.png"
about_image = "images/team/jonathan-katz.jpg"
katzen_bio_url = "https://www.katzeneye.com/doctors/jonathan-katz/"
katzen_url = "https://www.katzeneye.com/"
# Dr. Katz's tools for eye care professionals. Linked from the footer
# ("For clinicians") and described on the About page.
clinician_sites = [
  { name = "Ectasia Risk", url = "https://ectasiarisk.com/" },
  { name = "Munnerlyn Formula", url = "https://munnerlynformula.com/" },
  { name = "op.report", url = "https://op.report/" },
]
# Main number shown in "call to schedule" blocks (Lutherville / Towson office).
main_phone = "410-821-9490"
# --- Plausible Analytics (self-hosted, proxied first-party) ------------
# `src` and `api_endpoint` are served from THIS domain and proxied to
# plausible.katz.vision by Cloudflare Functions, so ad blockers (which match both the
# "plausible" hostname and the standard /js/script.js and /api/event
# paths) don't strip them. These two values must match the paths
# handled in functions/js/vx.js.js and functions/vx/event.js.
#
# Direct, non-proxied equivalents, if you ever want to go back:
#   src = "https://plausible.katz.vision/js/script.outbound-links.js"
#   api_endpoint = ""            (leave empty to use the script's default)
[extra.plausible]
enabled = true
domain = "jonathankatzmd.com"
src = "/js/vx.js"
api_endpoint = "/vx/event"
# Adds the window.plausible queue stub, required to fire custom events
# (used by the 404 tracking on templates/404.html).
custom_events = true


# Top navigation. `children` renders a dropdown.
# The Videos page exists (content/videos.md) but is a draft until there are
# videos to show, so it is not linked here.
[[extra.menus]]
name = "HOME"
url = "/"
icon = "images/nav/home.svg"

[[extra.menus]]
name = "ABOUT"
url = "/about/"
icon = "images/nav/doctor.svg"

[[extra.menus]]
name = "TOOLS"
url = "/patients/"
icon = "images/nav/eye.svg"
  [[extra.menus.children]]
  name = "EYE MEDICATION REFERENCE"
  url = "/patients/eye-drops/"
  [[extra.menus.children]]
  name = "EYE DROP SCHEDULE BUILDER"
  url = "/patients/eye-drop-form/"
  [[extra.menus.children]]
  name = "POST-OP EYE DROP SCHEDULE"
  url = "/patients/post-op-schedule/"

# `mega = true` makes the Learn menu one panel that lists every article under
# its topic, built from the Learn section (see partials/navbar.html), so a
# new article or topic appears in the menu by itself. `children` are the
# extra links along the bottom of the panel.
[[extra.menus]]
name = "LEARN"
url = "/learn/"
icon = "images/nav/book.svg"
mega = true
  [[extra.menus.children]]
  name = "When to call the same day"
  url = "/learn/when-to-call/"
  [[extra.menus.children]]
  name = "All topics"
  url = "/learn/"

[[extra.menus]]
name = "CONTACT"
url = "/contact/"
icon = "images/nav/human-greeting-proximity.svg"

[[extra.menus]]
name = "SEARCH"
url = "/search/"
icon = "images/nav/search.svg"
# On wide screens show only the magnifier (the word stays for screen readers
# and in the phone menu), so the menu still fits on one row next to the name.
icon_only = true

