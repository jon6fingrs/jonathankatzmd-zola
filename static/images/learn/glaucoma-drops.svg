<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 500" width="760" height="500" role="img" aria-label="Where each kind of glaucoma drop works: the faucet that makes fluid, the main drain and the side drain"><title>Where each kind of glaucoma drop works: the faucet that makes fluid, the main drain and the side drain</title><defs><marker id="ah" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2a6ebb"/></marker><marker id="ahg" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#16a34a"/></marker><pattern id="tm" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="6" height="6" fill="#fde68a"/><line x1="0" y1="0" x2="0" y2="6" stroke="#b45309" stroke-width="2"/></pattern><pattern id="cloud" width="14" height="14" patternUnits="userSpaceOnUse"><rect width="14" height="14" fill="#d1d5db"/><circle cx="4" cy="4" r="2.2" fill="#9ca3af"/><circle cx="11" cy="10" r="1.6" fill="#9ca3af"/></pattern></defs><rect width="760" height="500" fill="#ffffff"/><g transform="translate(0,80)"><path d="M298,92 C420,50 560,40 720,44 L720,70 C560,66 422,76 304,116 Z" fill="#f8fafc" stroke="#6b7280" stroke-width="2"/><path d="M110,400 C110,250 190,128 298,92 L304,116 C204,148 128,262 128,400 Z" fill="#dbeafe" stroke="#3b82f6" stroke-width="2"/><path d="M312,118 C340,106 372,98 400,96 C392,130 372,160 340,170 C326,160 314,142 312,118 Z" fill="#f2b8b5" stroke="#b45454" stroke-width="1.5"/><path d="M385,400 m-100,0 a100,222 0 0,1 200,0 Z" fill="#fef9c3" stroke="#ca8a04" stroke-width="2"/><line x1="342" y1="166" x2="372" y2="184" stroke="#a8a29e" stroke-width="1"/><line x1="352" y1="160" x2="388" y2="180" stroke="#a8a29e" stroke-width="1"/><line x1="362" y1="152" x2="400" y2="183" stroke="#a8a29e" stroke-width="1"/><line x1="372" y1="144" x2="412" y2="190" stroke="#a8a29e" stroke-width="1"/><path d="M300,124 C292,180 280,250 270,300 L286,302 C296,252 306,186 316,128 Z" fill="#8b5e3c" stroke="#5c3d26" stroke-width="1.5"/><path d="M292,104 L305,100 L309,122 L299,126 Z" fill="url(#tm)" stroke="#b45309" stroke-width="1.2"/><ellipse cx="312" cy="100" rx="8" ry="4.5" fill="#93c5fd" stroke="#1d4ed8" stroke-width="1.2"/><line x1="90" y1="400" x2="720" y2="400" stroke="#d1d5db" stroke-width="1.5" stroke-dasharray="4 6"/><path d="M330,152 C350,140 372,128 410,104 C450,86 520,74 600,70" stroke="#16a34a" stroke-width="4" fill="none" stroke-linecap="round" stroke-dasharray="9 6" marker-end="url(#ahg)"/><path d="M270,150 C280,132 288,122 300,114" stroke="#2a6ebb" stroke-width="4" fill="none" stroke-linecap="round" marker-end="url(#ah)"/><text x="20" y="-50" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="20" font-weight="700" fill="#2a6ebb" text-anchor="start">Main drain (meshwork)</text><text x="20" y="-26" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="18" font-weight="400" fill="#1f2937" text-anchor="start">netarsudil, pilocarpine,</text><text x="20" y="-4" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="18" font-weight="400" fill="#1f2937" text-anchor="start">latanoprostene bunod</text><line x1="150" y1="4" x2="296" y2="110" stroke="#5b6573" stroke-width="1.5"/><circle cx="296" cy="110" r="3.5" fill="#5b6573"/><text x="470" y="-50" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="20" font-weight="700" fill="#15803d" text-anchor="start">Side drain</text><text x="470" y="-26" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="18" font-weight="400" fill="#1f2937" text-anchor="start">prostaglandins: latanoprost,</text><text x="470" y="-4" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="18" font-weight="400" fill="#1f2937" text-anchor="start">travoprost, bimatoprost,</text><text x="470" y="18" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="18" font-weight="400" fill="#1f2937" text-anchor="start">tafluprost; also omidenepag</text><line x1="560" y1="26" x2="540" y2="72" stroke="#5b6573" stroke-width="1.5"/><circle cx="540" cy="72" r="3.5" fill="#5b6573"/><text x="500" y="170" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="20" font-weight="700" fill="#b45454" text-anchor="start">Faucet (ciliary body)</text><text x="500" y="194" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="18" font-weight="400" fill="#1f2937" text-anchor="start">makes less fluid:</text><text x="500" y="216" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="18" font-weight="400" fill="#1f2937" text-anchor="start">timolol (beta blockers),</text><text x="500" y="238" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="18" font-weight="400" fill="#1f2937" text-anchor="start">brimonidine, dorzolamide,</text><text x="500" y="260" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="18" font-weight="400" fill="#1f2937" text-anchor="start">brinzolamide, and the</text><text x="500" y="282" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="18" font-weight="400" fill="#1f2937" text-anchor="start">acetazolamide pills</text><line x1="496" y1="176" x2="392" y2="118" stroke="#5b6573" stroke-width="1.5"/><circle cx="392" cy="118" r="3.5" fill="#5b6573"/></g></svg>